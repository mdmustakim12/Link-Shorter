<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<title>Link Shorter &amp; Link List Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root{
    --bg0:#07070d;
    --card: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.09);
    --txt:#eceaf6;
    --muted:#9a97ad;
    --faint:#6f6c82;
    --ac1:#8b5cf6; --ac2:#6366f1; --ac3:#22d3ee; --ac4:#ec4899;
    --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  }

  html, body { height: 100%; }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Bengali", sans-serif;
    color: var(--txt);
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(99,102,241,.20), transparent 60%),
      radial-gradient(900px 700px at -10% 20%, rgba(139,92,246,.16), transparent 55%),
      radial-gradient(800px 600px at 60% 110%, rgba(34,211,238,.12), transparent 55%),
      linear-gradient(180deg, #08080f, #0b0b15 55%, #07070d);
    background-attachment: fixed;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Floating gradient orbs */
  .orb{ position: fixed; border-radius: 50%; filter: blur(90px); opacity:.5; z-index:-1; pointer-events:none; animation: float 16s ease-in-out infinite; }
  .orb1{ width:420px; height:420px; top:-120px; right:-80px; background: radial-gradient(circle at 30% 30%, #7c3aed, transparent 70%); }
  .orb2{ width:360px; height:360px; bottom:-100px; left:-90px; background: radial-gradient(circle at 60% 40%, #2563eb, transparent 70%); animation-delay:-6s; }
  .orb3{ width:300px; height:300px; top:40%; left:55%; background: radial-gradient(circle at 40% 60%, #06b6d4, transparent 70%); opacity:.33; animation-delay:-10s; }
  @keyframes float{ 0%,100%{ transform: translateY(0) translateX(0) scale(1);} 50%{ transform: translateY(-40px) translateX(25px) scale(1.08);} }

  .wrap{ max-width: 780px; margin: 0 auto; padding: 34px 18px 60px; }

  /* Header */
  .app-header{ text-align:center; margin-bottom: 26px; }
  .logo{ width:66px; height:66px; margin:0 auto 14px; display:grid; place-items:center; font-size:31px; border-radius:20px;
    background: linear-gradient(135deg, rgba(139,92,246,.28), rgba(34,211,238,.18));
    border:1px solid rgba(255,255,255,.14);
    box-shadow: 0 12px 40px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  h1{ font-size: clamp(21px, 4.5vw, 30px); font-weight:800; letter-spacing:.3px; line-height:1.25;
    background: linear-gradient(90deg,#c4b5fd,#818cf8,#67e8f9);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .tagline{ color: var(--muted); margin-top:8px; font-size:14px; max-width:560px; margin-inline:auto; }

  /* Glass cards */
  .card{
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.028));
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    border:1px solid var(--border); border-radius: 22px; padding: 22px; margin-bottom: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .card-head h2{ font-size:17px; font-weight:700; }

  .lbl{ display:block; font-size:12.5px; color:var(--muted); margin: 12px 0 7px; font-weight:600; letter-spacing:.2px; }
  .lbl span{ color:var(--faint); font-weight:400; }

  textarea#inputBox, input#batchBox{
    width:100%; background: rgba(6,6,14,.55); border:1px solid rgba(255,255,255,.10); border-radius:14px;
    color:#e7e5f4; padding:13px 15px; font-size:14px; outline:none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  textarea#inputBox{ min-height:240px; resize:vertical; font-family: ui-monospace, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; line-height:1.55; }
  input#batchBox{ font-family: inherit; }
  textarea#inputBox:focus, input#batchBox:focus{
    border-color: rgba(139,92,246,.6);
    box-shadow: 0 0 0 4px rgba(139,92,246,.14), 0 0 30px rgba(139,92,246,.18);
    background: rgba(10,10,22,.6);
  }
  ::placeholder{ color:#57566a; }

  .btn-row{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:15px; border-radius:14px;
    padding:14px 22px; display:inline-flex; align-items:center; gap:8px; justify-content:center;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
  }
  .btn.primary{ background: linear-gradient(135deg,#7c3aed,#4f46e5 55%,#0891b2); color:#fff;
    box-shadow: 0 10px 30px rgba(99,102,241,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.primary:hover{ filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 16px 40px rgba(99,102,241,.5); }
  .btn.primary:active{ transform: translateY(0) scale(.98); }
  .btn.ghost{ background: rgba(255,255,255,.06); color:#cfcce0; border:1px solid rgba(255,255,255,.12); }
  .btn.ghost:hover{ background: rgba(255,255,255,.1); }
  .btn.sm{ padding:9px 15px; font-size:13.5px; border-radius:11px; }
  .mini{ background:transparent; color:var(--muted); border:1px dashed rgba(255,255,255,.2); padding:6px 12px; border-radius:10px; font-size:12px; cursor:pointer; font-family:inherit; transition:.2s; }
  .mini:hover{ color:#fff; border-color: rgba(139,92,246,.6); }

  /* Status banner */
  .status{ display:none; align-items:center; gap:10px; padding:13px 16px; border-radius:14px; font-weight:600; font-size:14.5px; margin-bottom:14px; animation: pop .45s ease; }
  .status.ok{ display:flex; background: linear-gradient(135deg, rgba(16,185,129,.16), rgba(16,185,129,.06)); border:1px solid rgba(52,211,153,.35); color:#a7f3d0; }
  .status.err{ display:flex; background: linear-gradient(135deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border:1px solid rgba(248,113,113,.35); color:#fecaca; }
  @keyframes pop{ 0%{ transform: translateY(-6px); opacity:0;} 100%{ transform: translateY(0); opacity:1;} }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{ font-size:12px; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); color:#c9c6dc; font-weight:600; }
  .chip b{ color:#eae7ff; }
  .chip.ok{ color:#a7f3d0; border-color: rgba(52,211,153,.3); background: rgba(16,185,129,.1); }

  .output{
    background: rgba(5,5,12,.6); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:18px;
    font-family: ui-monospace, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-size:13.5px; line-height:1.8; white-space: pre-wrap; word-break: break-word; color:#d9d7ea;
    max-height: 560px; overflow-y:auto; box-shadow: inset 0 2px 18px rgba(0,0,0,.5);
  }
  .output::-webkit-scrollbar{ width:10px; }
  .output::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius:8px; }
  .output::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,.2); }

  .note{ margin-top:14px; font-size:11.5px; color:var(--muted); background: rgba(255,255,255,.03); border:1px dashed rgba(255,255,255,.12); border-radius:12px; padding:10px 13px; line-height:1.75; }
  .note b{ color:#cfcce0; }

  footer{ text-align:center; color:var(--faint); font-size:12px; margin-top:26px; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,32,.92); border:1px solid rgba(255,255,255,.14); color:#fff;
    padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:.25s ease;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index:50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px){
    .card{ padding:16px; border-radius:18px; }
    .btn-row{ flex-direction:column; }
    .btn{ width:100%; }
    textarea#inputBox{ min-height:210px; font-size:13px; }
    .output{ font-size:12.5px; padding:14px; }
  }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <main class="wrap">
    <header class="app-header">
      <div class="logo">🔗</div>
      <h1>Link Shorter <span>&amp;</span> Link List Generator</h1>
      <p class="tagline">ফেসবুক পোস্ট লিংক + রিঅ্যাক্ট/কমেন্ট নির্দেশনা — এক ক্লিকে সুন্দর করে সাজানো লিস্ট</p>
    </header>

    <!-- Input -->
    <section class="card">
      <div class="card-head">
        <h2>📥 ইনপুট</h2>
        <button class="mini" id="sampleBtn" type="button">✨ নমুনা লোড করুন</button>
      </div>
      <label class="lbl" for="inputBox">লিংক ইনপুট <span>(Link No + URL + নির্দেশনা)</span></label>
      <textarea id="inputBox" spellcheck="false"></textarea>

      <label class="lbl" for="batchBox">ব্যাচ (Batch)</label>
      <input id="batchBox" placeholder="খালি রাখলে অটো: 81-100" autocomplete="off" />

      <div class="btn-row">
        <button class="btn primary" id="shortBtn" type="button">⚡ Short Now</button>
        <button class="btn ghost" id="clearBtn" type="button">🗑️ Clear</button>
      </div>
    </section>

    <!-- Output -->
    <section class="card" id="outCard" hidden>
      <div class="card-head">
        <h2>📤 আউটপুট</h2>
        <button class="btn primary sm" id="copyBtn" type="button">📋 Copy Output</button>
      </div>
      <div class="status" id="status"></div>
      <div class="chips" id="stats"></div>
      <div class="output" id="output"></div>
      <div class="note" id="note"></div>
    </section>

    <footer>Made with 💜 · ইনপুট ও আউটপুট আপনার ব্রাউজারে (LocalStorage) সেভ থাকে — Clear চাপলে মুছে যাবে</footer>
  </main>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================
   Link Shorter & Link List Generator
   - Single file, dark glassmorphism UI
   - Parses Facebook post links + reaction/comment instructions
   - Sorts by number, marks missing links, admin/vip at bottom
   - LocalStorage persistence (safe fallback for sandboxed preview)
   ========================================================= */

/* ---------- Safe storage (works even in sandboxed iframe) ---------- */
const store = (function(){
  try {
    const t = "__t__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch(e){
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k,v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; }
    };
  }
})();

const KEY_INPUT  = "lsg.input";
const KEY_BATCH  = "lsg.batch";
const KEY_RESULT = "lsg.result";

/* ---------- Emoji / label rotation ---------- */
const HEAD_EMOJIS    = ['🎯','🌟','🌀','🔥','🌈','⚡','🌸','💎','🎉','🌍','🎁','🪐','🍀','💫','🕊️','🎈','✨','🏆','🔮','🌺'];
const LABELS         = ['Post','Post No','Link','Serial','Serial No','Count'];
const COMMENT_EMOJIS = ['😊','😍','😻','😇','😘','😜','😙','💖','🥰','😎','🤩','😁'];

/* ---------- Helpers ---------- */
function cleanLine(s){
  return s.replace(/[\u200B-\u200F\uFEFF]/g, "").replace(/\s+$/, "");
}

function decodeEntities(s){
  return s
    .replace(/&amp;/g,  "&")
    .replace(/&lt;/g,   "<")
    .replace(/&gt;/g,   ">")
    .replace(/&quot;/g, '"')
    .replace(/&#0*39;/g,"'");
}

/* ---------- Header detection ---------- */
function parseHeader(line){
  const s = line.replace(/[\u200B-\u200F\uFEFF]/g, "").trim();
  if(!s) return null;

  // Special: #VIP / #Admin / #Moderator ...
  if(s.startsWith("#")){
    return { type:"special", label:s };
  }

  // Numbered header: Link / Post / Serial / Count ... + number
  const kw = s.match(/^(link|post|serial|count)\b/i);
  if(kw){
    const numMatch = s.match(/\d+/);
    if(numMatch){
      const after = s.slice(numMatch.index + numMatch[0].length).trim();
      const extra = after.replace(/^[\s:.\-–—,]+/, "").trim();
      return { type:"normal", number: parseInt(numMatch[0], 10), extra };
    }
  }

  // Bare number on its own line
  if(/^\d{1,5}$/.test(s)){
    return { type:"normal", number: parseInt(s, 10), extra:"" };
  }

  return null;
}

/* ---------- Split input into blocks ---------- */
function parseBlocks(text){
  const lines  = text.split(/\r?\n/);
  const blocks = [];
  let cur = null;

  const push = () => { if(cur) blocks.push(cur); cur = null; };

  for(const raw of lines){
    const line = cleanLine(raw);
    const hdr  = parseHeader(line);
    if(hdr){
      push();
      cur = { type: hdr.type, number: hdr.number, label: hdr.label, body: [] };
      if(hdr.type === "normal" && hdr.extra) cur.body.push(hdr.extra);
    } else if(cur){
      cur.body.push(line);
    }
  }
  push();

  // resolve URL + instruction for each block
  return blocks.map(b => {
    let url = "", urlLineIdx = -1;
    for(let i = 0; i < b.body.length; i++){
      const m = b.body[i].match(/https?:\/\/[^\s"'<>]+/);
      if(m){ url = m[0]; urlLineIdx = i; break; }
    }
    url = decodeEntities(url);

    const ins = [];
    for(let i = 0; i < b.body.length; i++){
      let l = b.body[i];
      if(i === urlLineIdx && url){
        l = l.replace(/https?:\/\/[^\s"'<>]+/, "").trim();
      }
      l = decodeEntities(l.trim());
      if(l !== "") ins.push(l);
    }

    return { type: b.type, number: b.number, label: b.label, url, instruction: ins };
  }).filter(b => b.url !== "" || b.instruction.length > 0);
}

/* ---------- Special section ordering ---------- */
const SPECIAL_TYPE_ORDER = { admin:0, moderator:1, mod:1, vip:2 };
function specialKey(b){
  const m = (b.label || "").match(/#\s*(admin|mod(?:erator)?|vip)?\s*(\d*)/i);
  let type = "other", num = 0;
  if(m && m[1]) type = m[1].toLowerCase();
  if(type === "mod") type = "moderator";
  if(m && m[2]) num = parseInt(m[2], 10) || 0;
  return [ (SPECIAL_TYPE_ORDER[type] !== undefined ? SPECIAL_TYPE_ORDER[type] : 3), num ];
}

/* ---------- Generate formatted output ---------- */
function generateOutput(blocks, batchInput){
  const normal  = blocks.filter(b => b.type === "normal").sort((a,b) => a.number - b.number);
  const special = blocks.filter(b => b.type === "special").sort((a,b) => {
    const ka = specialKey(a), kb = specialKey(b);
    if(ka[0] !== kb[0]) return ka[0] - kb[0];
    return ka[1] - kb[1];
  });

  // Batch label
  let batchLabel;
  if(batchInput && batchInput.trim()){
    batchLabel = batchInput.trim().replace(/^batch\s*:?\s*/i, "").trim() || "—";
  } else if(normal.length){
    const min = normal[0].number, max = normal[normal.length - 1].number;
    batchLabel = (min === max) ? String(min) : (min + "-" + max);
  } else {
    batchLabel = "—";
  }

  // Missing numbers
  const present = new Set(normal.map(b => b.number));
  const skipped = [];
  if(normal.length){
    for(let n = normal[0].number; n <= normal[normal.length - 1].number; n++){
      if(!present.has(n)) skipped.push(n);
    }
  }

  const out = [];
  out.push("⚡ ─── BATCH: " + batchLabel + " ─── ⚡");
  out.push("");

  const pendingSkipped = skipped.slice(); // ascending

  normal.forEach((b, i) => {
    const emoji = HEAD_EMOJIS[i % HEAD_EMOJIS.length];
    const label = LABELS[i % LABELS.length];
    const cmt   = COMMENT_EMOJIS[i % COMMENT_EMOJIS.length];

    // emit missing numbers before this one
    while(pendingSkipped.length && pendingSkipped[0] < b.number){
      out.push("📌 Link No " + pendingSkipped.shift() + " (নেই — Skipped)");
      out.push("");
    }

    out.push(emoji + " " + label + ": " + b.number);
    out.push("📌 " + (b.url || "(লিংক পাওয়া যায়নি)"));

    const ins = b.instruction;
    if(ins.length === 0){
      out.push("💬 " + cmt);
    } else if(ins.length === 1){
      out.push("💬 " + ins[0] + " " + cmt);
    } else {
      out.push("💬 " + ins[0]);
      for(let k = 1; k < ins.length - 1; k++) out.push("   " + ins[k]);
      out.push("   " + ins[ins.length - 1] + " " + cmt);
    }
    out.push("");

    // stylish break after every 10 links
    if((i + 1) % 10 === 0){
      out.push("✨🔥 --- 🔥✨");
      out.push("");
    }
  });

  // any skipped numbers after the last link
  while(pendingSkipped.length){
    out.push("📌 Link No " + pendingSkipped.shift() + " (নেই — Skipped)");
    out.push("");
  }

  // Admin / Moderator / VIP section
  if(special.length){
    out.push("━━━━━━━━━━━━━━━━━━━━━");
    out.push("🛡️ ADMIN / MODERATOR / VIP 🛡️");
    out.push("━━━━━━━━━━━━━━━━━━━━━");
    out.push("");
    special.forEach(b => {
      out.push(b.label);
      b.instruction.forEach(l => out.push(l));
      out.push("📌 " + (b.url || "(লিংক পাওয়া যায়নি)"));
      out.push("");
    });
  }

  while(out.length && out[out.length - 1] === "") out.pop();

  const allUrls = blocks.map(b => b.url).filter(Boolean);
  const fbWatch = allUrls.filter(u => /fb\.watch/i.test(u));

  return {
    outputText: out.join("\n"),
    batchLabel,
    normalCount: normal.length,
    specialCount: special.length,
    skipped,
    fbWatch
  };
}

/* ---------- UI elements ---------- */
const $ = id => document.getElementById(id);
const inputBox  = $("inputBox");
const batchBox  = $("batchBox");
const shortBtn  = $("shortBtn");
const clearBtn  = $("clearBtn");
const sampleBtn = $("sampleBtn");
const outCard   = $("outCard");
const statusEl  = $("status");
const statsEl   = $("stats");
const outputEl  = $("output");
const noteEl    = $("note");
const copyBtn   = $("copyBtn");
const toastEl   = $("toast");

/* ---------- Status ---------- */
function showOk(){
  statusEl.className = "status ok";
  statusEl.textContent = "সফলভাবে লিংক সাজানো সম্পূর্ণ হয়েছে ✅";
  replayAnim(statusEl);
}
function showErr(msg){
  statusEl.className = "status err";
  statusEl.textContent = "⚠️ " + msg;
  replayAnim(statusEl);
}
function replayAnim(el){
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "";
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* ---------- Note (small, view-only) ---------- */
function buildNote(res){
  const parts = [];
  parts.push("📦 <b>ব্যাচ:</b> " + res.batchLabel);
  parts.push("🔢 <b>মোট লিংক:</b> " + res.normalCount + " টি" + (res.specialCount ? " + " + res.specialCount + " টি Admin/VIP" : ""));
  if(res.skipped.length){
    parts.push("⏭️ <b>স্কিপ করা:</b> " + res.skipped.join(", "));
  } else {
    parts.push("⏭️ <b>স্কিপ করা:</b> নেই ✅");
  }
  if(res.fbWatch.length){
    parts.push("🔗 <b>fb.watch চেক:</b> " + res.fbWatch.length + " টি fb.watch লিংক পাওয়া গেছে — পোস্ট করার আগে খুলে যাচাই করুন ✅");
  } else {
    parts.push("🔗 <b>fb.watch চেক:</b> fb.watch লিংক পাওয়া যায়নি — সব লিংক সরাসরি facebook.com ✅");
  }
  return parts.join("<br>");
}

/* ---------- Render ---------- */
function renderResult(res){
  outputEl.textContent = res.outputText;
  showOk();

  statsEl.innerHTML =
    '<span class="chip">📦 <b>' + res.batchLabel + '</b></span>' +
    '<span class="chip">🔢 মোট লিংক: <b>' + res.normalCount + '</b></span>' +
    '<span class="chip ok">⏭️ স্কিপ: <b>' + res.skipped.length + '</b></span>' +
    (res.specialCount ? '<span class="chip">🛡️ Admin/VIP: <b>' + res.specialCount + '</b></span>' : '') +
    '<span class="chip">✏️ অক্ষর: <b>' + res.outputText.length + '</b></span>';

  noteEl.innerHTML = buildNote(res);
  outCard.hidden = false;

  saveAll();
}

/* ---------- Main action ---------- */
function shortNow(){
  const text = inputBox.value;
  if(!text.trim()){
    outCard.hidden = false;
    showErr("ইনপুট বক্স খালি! উপরের ফরম্যাটে লিংক দিন।");
    return;
  }

  const blocks = parseBlocks(text);
  const normalCount = blocks.filter(b => b.type === "normal").length;

  if(blocks.length === 0){
    outCard.hidden = false;
    showErr("কোনো লিংক খুঁজে পাওয়া যায়নি। Link No + URL সহ ইনপুট দিন।");
    return;
  }
  if(normalCount === 0){
    outCard.hidden = false;
    showErr("Link No সহ কোনো সাধারণ লিংক পাওয়া যায়নি (শুধু #Admin/#VIP থাকলে কাজ করবে না)।");
    return;
  }

  const res = generateOutput(blocks, batchBox.value);
  renderResult(res);

  setTimeout(() => {
    try { outCard.scrollIntoView({ behavior:"smooth", block:"start" }); } catch(e){}
  }, 60);
}

/* ---------- Copy ---------- */
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "-9999px";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function copyOutput(){
  const text = outputEl.textContent;
  if(!text){ toast("কপি করার মতো কিছু নেই"); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      toast("📋 সম্পূর্ণ আউটপুট কপি হয়েছে ✅");
      flashCopyBtn();
    }).catch(() => {
      const ok = fallbackCopy(text);
      toast(ok ? "📋 কপি হয়েছে ✅" : "❌ কপি ব্যর্থ — ম্যানুয়ালি কপি করুন");
    });
  } else {
    const ok = fallbackCopy(text);
    toast(ok ? "📋 কপি হয়েছে ✅" : "❌ কপি ব্যর্থ — ম্যানুয়ালি কপি করুন");
  }
}
function flashCopyBtn(){
  const old = copyBtn.textContent;
  copyBtn.textContent = "✅ Copied!";
  setTimeout(() => { copyBtn.textContent = old; }, 1600);
}

/* ---------- Persistence ---------- */
function saveAll(){
  try {
    store.setItem(KEY_INPUT, inputBox.value);
    store.setItem(KEY_BATCH, batchBox.value);
    store.setItem(KEY_RESULT, JSON.stringify({
      output: outputEl.textContent,
      stats: statsEl.innerHTML,
      note: noteEl.innerHTML
    }));
  } catch(e){ /* ignore */ }
}
let saveTimer = null;
function debouncedSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 350);
}

function restore(){
  try {
    const inp = store.getItem(KEY_INPUT);
    const bat = store.getItem(KEY_BATCH);
    if(inp !== null) inputBox.value = inp;
    if(bat !== null) batchBox.value = bat;

    const res = store.getItem(KEY_RESULT);
    if(res){
      const data = JSON.parse(res);
      if(data.output){
        outputEl.textContent = data.output;
        statsEl.innerHTML = data.stats || "";
        noteEl.innerHTML  = data.note || "";
        outCard.hidden = false;
        showOk();
      }
    }
  } catch(e){ /* ignore */ }
}

function clearAll(){
  inputBox.value = "";
  batchBox.value = "";
  outputEl.textContent = "";
  statsEl.innerHTML = "";
  noteEl.innerHTML = "";
  outCard.hidden = true;
  statusEl.className = "status";
  try {
    store.removeItem(KEY_INPUT);
    store.removeItem(KEY_BATCH);
    store.removeItem(KEY_RESULT);
  } catch(e){ /* ignore */ }
  toast("🗑️ সব মুছে ফেলা হয়েছে");
  inputBox.focus();
}
